name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  app:
    name: App (${{ matrix.name }})
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: Windows x64
            os: windows-latest
          - name: macOS arm64
            os: macos-15
          - name: macOS x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
          cache-workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Pinote ${{ github.ref_name }}
          releaseBody: See the assets below to download Pinote for your platform.
          releaseDraft: true
          uploadUpdaterJson: true

  publish:
    name: Publish
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish release
        run: gh release edit "$TAG_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}

  winget:
    name: Publish to WinGet
    needs: publish
    runs-on: windows-latest

    steps:
      - name: Resolve release version
        id: version
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download wingetcreate
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest `
            -OutFile wingetcreate.exe

      - name: Submit WinGet update
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            Write-Error "Missing WINGET_CREATE_GITHUB_TOKEN secret"
            exit 1
          }

          $version = "${{ steps.version.outputs.version }}"
          $installerUrl = "https://github.com/imfeh2/pinote/releases/download/v$version/Pinote_${version}_x64_en-US.msi"

          .\wingetcreate.exe update ImFeH2.Pinote `
            -u $installerUrl `
            -v $version `
            -t $env:WINGET_CREATE_GITHUB_TOKEN `
            --submit
